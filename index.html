<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Instrument+Sans:wght@400;500&display=swap">

<style>
/* ============================================================
   Glass node network. Each category carries its tools in a tight
   orbit; hovering pushes them out to the satellite ring. One hue:
   light steel blue. A frosted core blurs the wires behind it.
   ============================================================ */
:root{
  --bg:#06070A;
  --accent:#B0C4DE;
  --accent-hot:#E1ECF9;
  --wire:rgba(176,196,222,.16);
  --wire-hot:rgba(176,196,222,.66);
  --glass:rgba(255,255,255,.045);
  --glass-line:rgba(255,255,255,.11);
  --ink:#E9EDF3;
  --ink-2:#8D97A7;
  --ink-3:#565E6A;

  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;

  /* the map is sized so the whole network fits without scrolling */
  --stage:min(1040px,90vw,calc(100vh - 126px));
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.55;color:var(--ink);
  background:
    radial-gradient(980px 800px at 50% 44%, #0E1118 0%, rgba(14,17,24,0) 72%),
    radial-gradient(620px 500px at 86% 4%, rgba(176,196,222,.06) 0%, rgba(176,196,222,0) 70%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
::selection{background:rgba(176,196,222,.22)}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px;border-radius:3px}
/* the map shows focus by promoting the node itself, so it never needs an outline box */
#map :focus,#map :focus-visible,#map a:focus{outline:none}

.wrap{max-width:1240px;margin:0 auto;padding-inline:28px}

.glass{
  background:var(--glass);
  border:1px solid var(--glass-line);
  border-radius:18px;
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 24px 60px rgba(0,0,0,.45);
}

/* ---------- masthead ---------- */
.masthead{
  position:relative;z-index:30;display:flex;align-items:center;
  justify-content:space-between;gap:20px;padding-block:24px 0;
}
.wordmark{
  font-family:var(--f-display);font-weight:600;font-size:13px;
  letter-spacing:.38em;text-transform:uppercase;color:var(--ink);
}
.mast-right{display:flex;align-items:center;gap:20px}
.count{font-size:11.5px;letter-spacing:.1em;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- map ---------- */
.mapsec{position:relative;display:flex;flex-direction:column;align-items:center;padding-block:0}
.stage{position:relative;width:var(--stage);height:var(--stage);flex:none;margin-block:-14px}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}

.core{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(var(--stage) * .235);height:calc(var(--stage) * .235);
  border-radius:50%;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(10px) saturate(170%);
  backdrop-filter:blur(10px) saturate(170%);
  will-change:opacity,transform;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.26),
    inset 0 -18px 38px rgba(176,196,222,.07),
    0 0 56px rgba(176,196,222,.10),
    0 22px 50px rgba(0,0,0,.5);
  display:grid;place-content:center;gap:7px;text-align:center;
  z-index:3;pointer-events:none;
  transition:opacity .45s ease, transform .5s cubic-bezier(.2,.7,.25,1);
}
.core b{
  display:block;font-family:var(--f-display);font-weight:600;
  font-size:calc(var(--stage) * .032);letter-spacing:.2em;color:var(--ink);line-height:1;
}
.core i{
  display:block;font-style:normal;font-size:calc(var(--stage) * .0145);
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.stage.focused .core{opacity:0;transform:translate(-50%,-50%) scale(.84)}

/* ---------- background constellation: atmosphere, never a connection ---------- */
.sky{pointer-events:none;transition:opacity .5s ease}
#map.focused .sky{opacity:.38}
.sky-line{stroke:rgba(176,196,222,.062);stroke-width:.85}
.sky-dot{fill:rgba(176,196,222,.42);animation:twinkle linear infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:.85}}

/* ---------- spokes: every category wired to the core, nothing else ---------- */
.spoke{fill:none;stroke:var(--wire);stroke-width:1.1}
.packet{fill:var(--accent-hot)}
/* the hub layer steps aside while one category holds the middle */
.mesh{transition:opacity .45s ease}
#map.focused .mesh{opacity:.07}

/* tethers from a category to its tools — geometry redrawn every frame */
.wire{fill:none;stroke:var(--wire-hot);stroke-width:1.1;opacity:0;transition:opacity .4s ease}
.wire.on{opacity:.75}

/* ---------- nodes ---------- */
.cat{transition:opacity .45s ease}
#map.focused .cat{opacity:.34}
#map.focused .cat.on{opacity:1}

.glow{transition:opacity .45s ease}
.bead{fill:var(--accent-hot)}
.bead.hollow{fill:rgba(176,196,222,.14);stroke:rgba(176,196,222,.42);stroke-width:1.2}
.ringlet{fill:none;stroke:rgba(176,196,222,.42);stroke-width:1;stroke-dasharray:2 7;
  opacity:0;transition:opacity .45s ease}
.cat.on .ringlet{opacity:1}
/* one catchment keeps the whole focused layout hoverable */
.focusfield{fill:transparent;pointer-events:none}
.cat.on .focusfield{pointer-events:all}

/* clicking a category flashes its tools rather than opening anything */
.pulse{fill:none;stroke:var(--accent-hot);stroke-width:2.5;opacity:0;pointer-events:none}
@keyframes pulsering{from{r:16px;opacity:.9}to{r:66px;opacity:0}}
@keyframes beadflash{0%{opacity:1}20%{opacity:.15}42%{opacity:1}64%{opacity:.28}100%{opacity:1}}
.cat.flash .pulse{animation:pulsering .72s ease-out}
.cat.flash .sat .bead,.cat.flash .lbl.sat-lbl{animation:beadflash .72s ease-out}

/* tools are always on screen — in a tight orbit at rest, flung out on hover */
.sat{pointer-events:none}
.cat.on .sat{pointer-events:auto}
.satwrap{cursor:pointer}
.satwrap:hover .glow,.satwrap:focus-visible .glow{opacity:1.5}

/* labels */
.lbl text{text-anchor:middle;dominant-baseline:central}
.lbl rect{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.11);stroke-width:1}
.lbl.flat rect{fill:rgba(6,7,10,.6);stroke:none}
.lbl.cat-lbl text{
  font-family:var(--f-display);font-weight:600;font-size:17px;
  letter-spacing:.18em;fill:var(--ink-2);transition:fill .4s ease;
}
.cat.on .lbl.cat-lbl text{fill:var(--ink)}
.lbl.cat-num text{
  font-family:var(--f-display);font-weight:500;font-size:12.5px;letter-spacing:.22em;
  fill:var(--ink-3);font-variant-numeric:tabular-nums;transition:fill .4s ease;
}
.cat.on .lbl.cat-num text{fill:var(--accent)}

.lbl.sat-lbl{
  opacity:0;transform:translate(0px,42px);
  transition:transform .4s cubic-bezier(.2,.7,.25,1), opacity .3s ease;
}
.cat.on .lbl.sat-lbl{opacity:1;transition:transform .4s cubic-bezier(.2,.7,.25,1), opacity .3s ease .22s}
.cat.reaching .lbl.sat-lbl{transform:translate(0px,46px)}
.satwrap:hover .lbl.sat-lbl,.satwrap:focus-visible .lbl.sat-lbl{transform:translate(0px,52px)}
.lbl.sat-lbl text{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:.035em;
  fill:var(--ink-2);transition:fill .3s ease}
.satwrap:hover .lbl.sat-lbl text{fill:var(--ink)}
.satwrap:hover .lbl.sat-lbl rect{fill:rgba(176,196,222,.14);stroke:rgba(176,196,222,.4)}
.satwrap.locked .lbl.sat-lbl text{fill:var(--ink-3)}

.hit{fill:transparent;pointer-events:all;cursor:pointer}

.hint{margin:0;padding-block:0 14px;
  font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- directory: a dropdown off the masthead, so it costs the map nothing ---------- */
.dir{position:relative}
.dir>summary{
  list-style:none;cursor:pointer;
  display:flex;align-items:center;gap:11px;
  padding:9px 15px;border-radius:999px;
  border:1px solid var(--glass-line);background:rgba(255,255,255,.04);
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  font-family:var(--f-display);font-weight:600;font-size:10px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);
  transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.dir>summary::-webkit-details-marker{display:none}
.dir>summary:hover{background:rgba(176,196,222,.1);border-color:rgba(176,196,222,.32);color:var(--ink)}
.dir[open]>summary{background:rgba(176,196,222,.12);border-color:rgba(176,196,222,.4);color:var(--ink)}
.dir .chev{
  width:7px;height:7px;flex:none;
  border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .25s ease;
}
.dir[open] .chev{transform:rotate(225deg) translate(-2px,-2px)}

.dir-panel{
  position:absolute;top:calc(100% + 12px);right:0;z-index:40;
  width:min(660px,calc(100vw - 44px));
  max-height:min(72vh,660px);overflow-y:auto;
  padding:20px 24px 18px;
  animation:dropin .22s cubic-bezier(.2,.75,.3,1);
}
@keyframes dropin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dir-panel .n{
  display:block;font-size:11px;letter-spacing:.1em;color:var(--ink-3);
  font-variant-numeric:tabular-nums;padding-bottom:12px;
  border-bottom:1px solid var(--glass-line);
}
.dir-foot{padding-top:14px;margin:0;font-size:11px;letter-spacing:.09em;color:var(--ink-3)}

.row{display:grid;grid-template-columns:148px minmax(0,1fr) auto;align-items:baseline;gap:18px;
  padding:14px 12px;margin-inline:-12px;border-bottom:1px solid rgba(255,255,255,.055);
  border-radius:10px;transition:background .2s ease}
a.row:hover{background:rgba(176,196,222,.06)}
.row:last-child{border-bottom:0}
.row .cat-c{font-family:var(--f-display);font-weight:500;font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);transition:color .2s ease}
a.row:hover .cat-c{color:var(--accent)}
.row .name{font-size:15.5px;font-weight:500;color:var(--ink)}
.row .note{display:block;font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.5;font-weight:400}
.row .end{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;transition:color .2s ease,transform .2s ease}
a.row:hover .end{color:var(--accent);transform:translateX(3px)}
.row.void .name{color:var(--ink-3);font-weight:400}


@media (max-width:820px){
  .wrap{padding-inline:18px}
  .count{display:none}
  .dir-panel{padding:18px 18px 16px}
  .row{grid-template-columns:1fr auto;gap:8px 16px}
  .row .cat-c{grid-column:1/-1;margin-bottom:2px}
}
@media (prefers-reduced-motion:reduce){
  .sky-dot{animation:none;opacity:.5}
}
</style>

<header class="masthead wrap">
  <div class="wordmark">MAMF AI</div>
  <div class="mast-right">
    <div class="count" id="count"></div>
    <details class="dir" id="dir">
      <summary>Directory <span class="chev" aria-hidden="true"></span></summary>
      <div class="dir-panel glass">
        <span class="n" id="dirCount"></span>
        <div id="rows"></div>
        <p class="dir-foot" id="foot"></p>
      </div>
    </details>
  </div>
</header>

<section class="mapsec wrap" aria-label="Tool network">
  <div class="stage" id="stage">
    <svg id="map" viewBox="-520 -520 1040 1040" role="img" aria-label="Network map of tool categories"></svg>
    <div class="core" id="core" aria-hidden="true"><b>MAMF AI</b><i id="coreSub"></i></div>
  </div>
  <p class="hint">Hover a node</p>
</section>


<script>
/* ==========================================================
   CONFIG — the only block to edit.
     url:""      renders as "link pending"
     gated:true  marks it as needing a sign-in
   Order = clockwise from the top of the ring.
   ========================================================== */
var CATEGORIES = [
  { name:"Prospecting",
    blurb:"Finding and ranking the next deal before anyone else does.",
    tools:[
      { name:"PBS8 Database", url:"https://mrare-cmd.github.io/HAP-Database/",
        note:"Project-based Section 8 contracts, rents and renewal options." },
      { name:"TOPA Dashboard", url:"https://mrare-cmd.github.io/mrare/",
        note:"DC TOPA and DOPA notices and offers of sale." },
      { name:"Priority Dashboard", url:"https://mrare-cmd.github.io/greysteel-hampton-roads/",
        note:"Ranked prospecting targets and outreach status." }
    ]},
  { name:"Underwriting",
    blurb:"Models, comps and assumptions that feed a deal's numbers.",
    tools:[
      { name:"OpEx Dashboard", url:"https://gs-expense-comps.pages.dev/", gated:true,
        note:"Operating expense comparables by market and asset type." }
    ]},
  { name:"Client Tools",
    blurb:"Things we put directly in a client's hands.",
    tools:[
      { name:"Inspection Assistant", url:"https://mrare-cmd.github.io/walkthrough/app.html",
        note:"Guided property walkthrough capture and write-up." }
    ]},
  { name:"Comparables",   blurb:"Sales, rent and expense comp sets.", tools:[] },
  { name:"Production",    blurb:"Turning underwriting into client-ready deliverables.", tools:[] },
  { name:"Miscellaneous", blurb:"Everything that does not belong to one desk yet.", tools:[] }
];

/* geometry, in viewBox units (the box is 1040 across, centred on 0,0) */
var R_CAT     = 318;  /* the circumference every category sits on        */
var R_MINI    = 40;   /* how far a tool orbits its category at rest      */
var R_CORE_IN = 104;  /* spokes start here, tucked under the glass core  */
var CAT_R     = 20;   /* category bead, at rest on the ring              */
var MINI_R    = 7;    /* tool bead, at rest in its little orbit          */

/* --- focus: one category takes the middle, the rest swing to the back --- */
var R_FOCUS   = 170;  /* how far in the focused category comes           */
var FOCUS_R   = 40;   /* the focused category's bead                     */
var BACK_R    = 8.5;  /* every other category, demoted                   */
var R_BACK    = 448;  /* the arc they swing out to                       */
var BACK_ARC  = 104;  /* degrees that arc spans                          */
var TOOL_ORBIT = 196; /* how wide its tools orbit it once promoted       */
var SAT_R     = 17;   /* tool bead, once it has arrived                  */
var SPIN      = 620;  /* seconds per revolution of the main ring         */
var MINI_SPIN = 95;   /* seconds per revolution of a tool around its own */
var PACKETS   = 12;   /* how much traffic rides the spokes               */

var NS = "http://www.w3.org/2000/svg";
var XL = "http://www.w3.org/1999/xlink";
var map = document.getElementById("map");
var stage = document.getElementById("stage");
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(n, a){
  var e = document.createElementNS(NS, n);
  for (var k in a) if (a.hasOwnProperty(k)) e.setAttribute(k, a[k]);
  return e;
}
function pol(r, deg){ var t = deg * Math.PI / 180; return [r * Math.cos(t), r * Math.sin(t)]; }
function fmt(p){ return p[0].toFixed(2) + " " + p[1].toFixed(2); }
function label(cls, y, text){
  var g = el("g", { class:"lbl " + cls });
  if (y !== null) g.setAttribute("transform", "translate(0," + y + ")");
  g.appendChild(el("rect", { x:"-1", y:"-1", width:"2", height:"2", rx:"9" }));
  var t = el("text", {}); t.textContent = text;
  g.appendChild(t);
  return g;
}

/* ---------- background constellation ----------
   Decoration only: under everything, no pointer events, drifting the other
   way at a third the speed so it reads as depth rather than wiring. */
var sky = el("g", { class:"sky" });
map.appendChild(sky);
(function(){
  var sp = [], tries = 0, MINSEP = 50, LINK = 132;
  while (sp.length < 62 && tries < 6000){
    tries++;
    var x = (Math.random() * 2 - 1) * 502, y = (Math.random() * 2 - 1) * 502;
    if (x * x + y * y < 140 * 140) continue;
    var ok = true;
    for (var i = 0; i < sp.length; i++){
      var dx = sp[i][0] - x, dy = sp[i][1] - y;
      if (dx * dx + dy * dy < MINSEP * MINSEP){ ok = false; break; }
    }
    if (ok) sp.push([x, y]);
  }
  var lines = el("g", {}), seen = {};
  for (var i = 0; i < sp.length; i++){
    var near = [];
    for (var j = 0; j < sp.length; j++){
      if (i === j) continue;
      var dx = sp[i][0] - sp[j][0], dy = sp[i][1] - sp[j][1], d2 = dx * dx + dy * dy;
      if (d2 < LINK * LINK) near.push([d2, j]);
    }
    near.sort(function(m, n){ return m[0] - n[0]; });
    for (var k = 0; k < Math.min(2, near.length); k++){
      var j2 = near[k][1], key = Math.min(i, j2) + ":" + Math.max(i, j2);
      if (seen[key]) continue;
      seen[key] = 1;
      lines.appendChild(el("line", { class:"sky-line",
        x1:sp[i][0].toFixed(1), y1:sp[i][1].toFixed(1),
        x2:sp[j2][0].toFixed(1), y2:sp[j2][1].toFixed(1) }));
    }
  }
  sky.appendChild(lines);
  var dots = el("g", {});
  sp.forEach(function(p, i){
    var c = el("circle", { class:"sky-dot", cx:p[0].toFixed(1), cy:p[1].toFixed(1),
      r:(1.1 + Math.random() * 1.5).toFixed(2) });
    /* only a third of them twinkle — sixty permanently animating nodes is a lot
       of compositor work for an effect nobody is watching */
    if (!reduce && i % 3 === 0){
      c.style.animationDuration = (4 + Math.random() * 7).toFixed(1) + "s";
      c.style.animationDelay = (-Math.random() * 9).toFixed(1) + "s";
    } else {
      c.style.animation = "none";
      c.style.opacity = (.3 + Math.random() * .42).toFixed(2);
    }
    dots.appendChild(c);
  });
  sky.appendChild(dots);
})();

/* defs */
var defs = el("defs", {});
var halo = el("radialGradient", { id:"halo" });
[[0,.44],[.32,.17],[.66,.04],[1,0]].forEach(function(s){
  halo.appendChild(el("stop", { offset:(s[0]*100)+"%", "stop-color":"#B0C4DE", "stop-opacity":s[1] }));
});
defs.appendChild(halo);
map.appendChild(defs);

/* mesh turns as one rigid piece; tethers and marks are placed per frame */
var mesh    = el("g", { class:"mesh" });
var tethers = el("g", { class:"tethers" });
var marks   = el("g", { class:"marks" });
map.appendChild(mesh);
map.appendChild(tethers);
map.appendChild(marks);

/* ---------- one spoke per category, core outward; nothing cross-links ---------- */
var STEP = 360 / CATEGORIES.length;
var spokeEls = CATEGORIES.map(function(c, i){
  var theta = -90 + i * STEP;
  var p = el("path", { class:"spoke", id:"sp" + i,
    d:"M " + fmt(pol(R_CORE_IN, theta)) + " L " + fmt(pol(R_CAT - 26, theta)) });
  mesh.appendChild(p);
  return p;
});

/* ---------- traffic running the spokes in and out of the core ---------- */
if (!reduce){
  for (var k = 0; k < PACKETS; k++){
    var src = spokeEls[k % spokeEls.length];
    var dur = (3.4 + Math.random() * 4.4).toFixed(2);
    var begin = (-Math.random() * dur).toFixed(2) + "s";
    var dot = el("circle", { class:"packet", r:(1.9 + Math.random() * 1.6).toFixed(1), opacity:"0" });
    var mo = el("animateMotion", { dur:dur + "s", begin:begin, repeatCount:"indefinite", calcMode:"linear" });
    if (Math.random() < .5){ mo.setAttribute("keyPoints", "1;0"); mo.setAttribute("keyTimes", "0;1"); }
    var mp = el("mpath", {});
    mp.setAttributeNS(XL, "xlink:href", "#" + src.id);
    mp.setAttribute("href", "#" + src.id);
    mo.appendChild(mp);
    dot.appendChild(mo);
    dot.appendChild(el("animate", { attributeName:"opacity", values:"0;.92;.92;0",
      keyTimes:"0;.14;.86;1", dur:dur + "s", begin:begin, repeatCount:"indefinite" }));
    mesh.appendChild(dot);
  }
}

/* ---------- nodes ---------- */
var cats = [];
var closeT = null;

CATEGORIES.forEach(function(cat, i){
  var theta = -90 + i * STEP;
  var n = cat.tools.length;
  var g = el("g", { class:"cat" });

  var state = {
    g:g, theta:theta, n:n, sats:[], wire:null, reaching:false, target:0, pt:[0,0],
    curR:R_CAT, curA:theta, bead:n ? CAT_R : CAT_R - 4, scale:1, lblY:70, numY:92,
    w:{}
  };

  /* Hover catchment. It goes in FIRST so the tools paint on top of it and keep
     receiving their own clicks — on top, it silently swallows every link. */
  g.appendChild(el("circle", { class:"focusfield", cx:0, cy:0, r:340 }));

  /* tether from the category out to each of its tools; geometry set per frame */
  if (n > 0){
    state.wire = el("path", { class:"wire", d:"" });
    tethers.appendChild(state.wire);
  }

  cat.tools.forEach(function(tool, j){
    var wrap = el(tool.url ? "a" : "g", { class:"satwrap" + (tool.url ? "" : " locked") });
    if (tool.url){
      wrap.setAttributeNS(XL, "xlink:href", tool.url);
      wrap.setAttribute("href", tool.url);
      wrap.setAttribute("target", "_blank");
      wrap.setAttribute("rel", "noopener");
      wrap.setAttribute("aria-label", tool.name);
    }
    var hold = el("g", {});
    var sg = el("g", { class:"sat" });
    sg.appendChild(el("circle", { class:"pulse", cx:0, cy:0, r:16 }));
    var glow = el("circle", { class:"glow", cx:0, cy:0, r:MINI_R * 3.2,
      fill:"url(#halo)", opacity:tool.url ? 1 : .4 });
    var bd = el("circle", { class:"bead" + (tool.url ? "" : " hollow"), cx:0, cy:0, r:MINI_R });
    sg.appendChild(glow); sg.appendChild(bd);
    sg.appendChild(label("sat-lbl", null, tool.name + (tool.gated ? "   ○" : "")));
    sg.appendChild(el("circle", { class:"hit", cx:0, cy:0, r:40 }));
    hold.appendChild(sg);
    wrap.appendChild(hold);
    g.appendChild(wrap);

    var s = {
      hold:hold, bead:bd, glow:glow,
      miniBase:(360 / n) * j - 90,  /* where it sits in its little orbit          */
      ringA:-90 + j * (360 / n),    /* where it swings to once its parent is up    */
      t:0, rNow:MINI_R, hovered:false, w:{}
    };
    state.sats.push(s);

    /* hovering any one tool lifts the whole set */
    wrap.addEventListener("pointerenter", function(){ s.hovered = true; state.reaching = true; g.classList.add("reaching"); });
    wrap.addEventListener("pointerleave", function(){ s.hovered = false; state.reaching = false; g.classList.remove("reaching"); });
    wrap.addEventListener("focus", function(){ s.hovered = true; state.reaching = true; g.classList.add("reaching"); activate(i); });
    wrap.addEventListener("blur", function(){ s.hovered = false; state.reaching = false; g.classList.remove("reaching"); release(); });
  });

  /* the category node */
  var chold = el("g", { class:"cat-hold" });
  state.ringEl = el("circle", { class:"ringlet", cx:0, cy:0, r:R_MINI - 4 });
  chold.appendChild(state.ringEl);
  state.glowEl = el("circle", { class:"glow", cx:0, cy:0, r:CAT_R * 3.4, fill:"url(#halo)",
    opacity:n ? 1 : .45 });
  chold.appendChild(state.glowEl);
  state.beadEl = el("circle", { class:"bead cat-bead" + (n ? "" : " hollow"), cx:0, cy:0,
    r:n ? CAT_R : CAT_R - 4 });
  chold.appendChild(state.beadEl);
  state.lblEl = label("cat-lbl flat", 70, cat.name.toUpperCase());
  chold.appendChild(state.lblEl);
  state.numEl = label("cat-num flat", 92, n ? String(n).padStart(2, "0") : "—");
  chold.appendChild(state.numEl);
  var hit = el("circle", { class:"hit", cx:0, cy:0, r:64, tabindex:"0", role:"button" });
  hit.setAttribute("aria-label", cat.name + ", " + n + (n === 1 ? " tool. " : " tools. ") + cat.blurb);
  state.hitEl = hit;
  chold.appendChild(hit);
  g.appendChild(chold);
  state.chold = chold;

  marks.appendChild(g);
  cats.push(state);

  g.addEventListener("pointerenter", function(){ activate(i); });
  g.addEventListener("pointerleave", release);
  hit.addEventListener("focus", function(){ activate(i); });
  hit.addEventListener("blur", release);
  hit.addEventListener("click", function(){ flash(state); });
  hit.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); activate(i); flash(state); }
  });
});

/* ---------- the slow turn, and the swing into focus ----------
   One category can hold the middle. When it does it grows, its tools ring it,
   and the other five swing around to a small arc on the opposite side. */
var spinA = 0, skyA = 0, miniA = 0, held = false, last = null, focusIdx = null;
var skyDue = 0, meshDue = 0;

/* Write an attribute only when it has actually moved. At rest this skips almost
   every write, which is most of what was making the map stutter. */
function putNum(el, w, key, attr, val, eps){
  if (w[key] !== undefined && Math.abs(w[key] - val) < eps) return;
  w[key] = val;
  el.setAttribute(attr, val.toFixed(2));
}
function putStr(el, w, key, attr, str){
  if (w[key] === str) return;
  w[key] = str;
  el.setAttribute(attr, str);
}

function frame(now){
  if (last === null) last = now;
  var dt = Math.min((now - last) / 1000, .05); last = now;
  var kFast = 1 - Math.exp(-dt / .16);   /* tools */
  var kSlow = 1 - Math.exp(-dt / .26);   /* categories */

  if (!reduce){
    if (!held) spinA = (spinA + dt * 360 / SPIN) % 360;
    miniA = (miniA + dt * 360 / MINI_SPIN) % 360;
    skyA = (skyA - dt * 360 / (SPIN * 3)) % 360;
  }
  /* The backdrop and the spoke layer turn far too slowly to need 60fps, and
     rotating either group repaints every child, so they get their own cadence. */
  skyDue -= dt;
  if (skyDue <= 0){ sky.setAttribute("transform", "rotate(" + skyA.toFixed(2) + ")"); skyDue = .25; }
  meshDue -= dt;
  if (meshDue <= 0){ mesh.setAttribute("transform", "rotate(" + spinA.toFixed(2) + ")"); meshDue = .12; }

  var backMid = focusIdx === null ? 0 : cats[focusIdx].theta + spinA + 180;
  var backStep = BACK_ARC / (cats.length - 2);

  for (var i = 0; i < cats.length; i++){
    var c = cats[i], w = c.w, tR, tA, tBead, tScale, tLblY, tNumY;

    if (focusIdx === null){                      /* at rest, out on the ring */
      tR = R_CAT; tA = c.theta + spinA;
      tBead = c.n ? CAT_R : CAT_R - 4;
      tScale = 1; tLblY = 70; tNumY = 92;
    } else if (focusIdx === i){                  /* drawn in toward the middle */
      tR = R_FOCUS; tA = c.theta + spinA;
      tBead = FOCUS_R;
      tScale = 1.38; tLblY = 92; tNumY = 124;
    } else {                                     /* swung round to the back */
      var kk = (i - focusIdx + cats.length) % cats.length;   /* 1..5, order kept */
      tR = R_BACK;
      tA = backMid - BACK_ARC / 2 + (kk - 1) * backStep;
      tBead = BACK_R;
      tScale = .7; tLblY = 26; tNumY = 42;
    }

    c.curA += (((tA - c.curA + 540) % 360) - 180) * kSlow;   /* shortest way round */
    c.curR += (tR - c.curR) * kSlow;
    c.bead += (tBead - c.bead) * kSlow;
    c.scale += (tScale - c.scale) * kSlow;
    c.lblY += (tLblY - c.lblY) * kSlow;
    c.numY += (tNumY - c.numY) * kSlow;

    var cp = pol(c.curR, c.curA);
    c.pt = cp;
    putStr(c.chold, w, "ct", "transform",
      "translate(" + cp[0].toFixed(1) + "," + cp[1].toFixed(1) + ")");
    putNum(c.beadEl, w, "br", "r", c.bead, .05);
    putNum(c.glowEl, w, "gr", "r", c.bead * 3.4, .2);
    putNum(c.ringEl, w, "rr", "r", c.bead * 1.8, .2);
    putNum(c.hitEl,  w, "hr", "r", Math.max(c.bead * 2.9, 42), .5);
    putStr(c.lblEl, w, "lt", "transform",
      "translate(0," + c.lblY.toFixed(1) + ") scale(" + c.scale.toFixed(3) + ")");
    putStr(c.numEl, w, "nt", "transform",
      "translate(0," + c.numY.toFixed(1) + ") scale(" + c.scale.toFixed(3) + ")");

    var d = "", moving = false;
    for (var j = 0; j < c.sats.length; j++){
      var s2 = c.sats[j];
      s2.t += (c.target - s2.t) * kFast;
      if (s2.t > .002 || c.target > 0) moving = true;
      var e = s2.t * s2.t * (3 - 2 * s2.t);      /* smoothstep the flight */

      /* Both ends are offsets from the parent, so a tool always orbits its own
         category — tight at rest, wide once that category has been promoted. */
      var ri = pol(R_MINI, s2.miniBase + miniA);
      var ro = pol(TOOL_ORBIT, s2.ringA + spinA);
      var x = cp[0] + ri[0] + (ro[0] - ri[0]) * e;
      var y = cp[1] + ri[1] + (ro[1] - ri[1]) * e;
      putStr(s2.hold, s2.w, "ht", "transform",
        "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ")");

      var rt = MINI_R + (SAT_R - MINI_R) * e;
      if (s2.hovered) rt = SAT_R * 1.5;
      else if (c.reaching) rt = SAT_R * 1.18;
      s2.rNow += (rt - s2.rNow) * kFast;
      putNum(s2.bead, s2.w, "br", "r", s2.rNow, .05);
      putNum(s2.glow, s2.w, "gr", "r", s2.rNow * 3.2, .3);

      d += " M " + cp[0].toFixed(1) + " " + cp[1].toFixed(1) +
           " L " + x.toFixed(1) + " " + y.toFixed(1);
    }
    if (c.wire && moving) putStr(c.wire, w, "d", "d", d.trim());
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- hover puts one category in the middle ---------- */
function activate(i){
  clearTimeout(closeT);
  held = true;
  focusIdx = i;
  map.classList.add("focused");
  stage.classList.add("focused");
  cats.forEach(function(c, kk){
    c.g.classList.toggle("on", kk === i);
    c.target = kk === i ? 1 : 0;
    if (c.wire) c.wire.classList.toggle("on", kk === i);
  });
}
/* grace period, so crossing the gap out to a tool never dismisses it */
function release(){
  clearTimeout(closeT);
  closeT = setTimeout(function(){
    held = false;
    focusIdx = null;
    map.classList.remove("focused");
    stage.classList.remove("focused");
    cats.forEach(function(c){
      c.g.classList.remove("on", "reaching");
      c.reaching = false;
      c.target = 0;
      if (c.wire) c.wire.classList.remove("on");
    });
  }, 340);
}
map.addEventListener("pointerleave", release);

/* ---------- clicking a category flashes its tools ---------- */
var flashT = null;
function flash(state){
  state.g.classList.remove("flash");
  void state.g.getBoundingClientRect();     /* force a reflow so it can replay */
  state.g.classList.add("flash");
  clearTimeout(flashT);
  flashT = setTimeout(function(){ state.g.classList.remove("flash"); }, 780);
}

/* ---------- size each label plate to its text ---------- */
function fitLabels(){
  var ls = map.querySelectorAll(".lbl");
  for (var i = 0; i < ls.length; i++){
    var t = ls[i].querySelector("text"), r = ls[i].querySelector("rect"), bb;
    try { bb = t.getBBox(); } catch (e) { continue; }
    if (!bb.width) continue;
    var flat = ls[i].classList.contains("flat");
    var px = flat ? 9 : 14, py = flat ? 4 : 8;
    r.setAttribute("x", (bb.x - px).toFixed(2));
    r.setAttribute("y", (bb.y - py).toFixed(2));
    r.setAttribute("width", (bb.width + px * 2).toFixed(2));
    r.setAttribute("height", (bb.height + py * 2).toFixed(2));
    r.setAttribute("rx", flat ? 5 : ((bb.height + py * 2) / 2).toFixed(2));
  }
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);
else window.addEventListener("load", fitLabels);
setTimeout(fitLabels, 1400);

/* ---------- counts ---------- */
var total = 0, live = 0, gated = 0, voids = 0;
CATEGORIES.forEach(function(c){
  total += c.tools.length;
  if (!c.tools.length) voids++;
  c.tools.forEach(function(t){ if (t.url) { if (t.gated) gated++; else live++; } });
});
document.getElementById("count").textContent = (live + gated) + " tools / " + CATEGORIES.length + " categories";
document.getElementById("coreSub").textContent = (live + gated) + " tools";
document.getElementById("dirCount").textContent =
  (live + gated) + " of " + total + " linked · " + voids + " categories empty";
document.getElementById("foot").textContent = "Edit the CATEGORIES block in index.html to add a tool.";

/* ---------- directory ---------- */
var rows = document.getElementById("rows");
CATEGORIES.forEach(function(cat){
  if (!cat.tools.length){
    var s = document.createElement("div");
    s.className = "row void";
    var c0 = document.createElement("span"); c0.className = "cat-c"; c0.textContent = cat.name;
    var n0 = document.createElement("span"); n0.className = "name"; n0.textContent = "Awaiting links";
    var e0 = document.createElement("span"); e0.className = "end"; e0.textContent = "—";
    s.appendChild(c0); s.appendChild(n0); s.appendChild(e0);
    rows.appendChild(s);
    return;
  }
  cat.tools.forEach(function(tool, j){
    var row = document.createElement(tool.url ? "a" : "div");
    row.className = "row" + (tool.url ? "" : " void");
    if (tool.url){ row.href = tool.url; row.target = "_blank"; row.rel = "noopener"; }
    var c = document.createElement("span"); c.className = "cat-c";
    c.textContent = j === 0 ? cat.name : "";
    var nm = document.createElement("span"); nm.className = "name";
    nm.appendChild(document.createTextNode(tool.name));
    if (tool.note){
      var note = document.createElement("span");
      note.className = "note"; note.textContent = tool.note;
      nm.appendChild(note);
    }
    var end = document.createElement("span"); end.className = "end";
    end.textContent = tool.url ? (tool.gated ? "Sign-in ↗" : "Open ↗") : "Link pending";
    row.appendChild(c); row.appendChild(nm); row.appendChild(end);
    rows.appendChild(row);
  });
});

/* ---------- directory dropdown: close on outside click and on Escape ---------- */
var dir = document.getElementById("dir");
document.addEventListener("pointerdown", function(e){
  if (dir.open && !dir.contains(e.target)) dir.open = false;
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && dir.open){
    dir.open = false;
    dir.querySelector("summary").focus();
  }
});
</script>
