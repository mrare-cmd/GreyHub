<title>MAMF AI Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">

<style>
/* ============================================================
   One material, one ring, no color-coding.
   Hierarchy comes from scale, brightness and distance.
   ============================================================ */
:root{
  --bg:#08090C;
  --line:rgba(255,255,255,.055);
  --line-2:rgba(255,255,255,.11);
  --line-3:rgba(255,255,255,.20);
  --ink:#F3F4F6;
  --ink-2:#9DA3AD;
  --ink-3:#5E636C;

  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;

  /* geometry — every planet sits on one circumference */
  --stage:min(780px,90vw);
  --r-planet:.300;   /* planet ring, as a fraction of the stage */
  --r-moon:.408;     /* satellite ring */
  --d-sun:calc(var(--stage) * .176);
  --d-planet:calc(var(--stage) * .088);
  --d-moon:calc(var(--d-planet) * .75);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--f-body);
  font-size:15px;line-height:1.55;color:var(--ink);
  background:
    radial-gradient(900px 640px at 50% 38%, #12141B 0%, rgba(18,20,27,0) 68%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
::selection{background:rgba(255,255,255,.16)}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px;border-radius:2px}

.wrap{max-width:1080px;margin:0 auto;padding-inline:28px}

/* ---------- masthead: a wordmark, nothing else ---------- */
.masthead{
  position:relative;z-index:6;
  display:flex;align-items:baseline;justify-content:space-between;gap:20px;
  padding-block:30px 0;
}
.wordmark{
  font-family:var(--f-display);font-weight:700;font-size:13px;
  letter-spacing:.34em;text-transform:uppercase;color:var(--ink);
}
.count{
  font-size:12px;letter-spacing:.02em;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}

/* ---------- map ---------- */
.mapsec{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.stage{
  position:relative;width:var(--stage);height:var(--stage);flex:none;
  margin-block:calc(var(--stage) * -.02);
}
.ring{
  position:absolute;left:50%;top:50%;border-radius:50%;
  border:1px solid var(--line);transform:translate(-50%,-50%);pointer-events:none;
}
.ring.planet-ring{
  width:calc(var(--stage) * var(--r-planet) * 2);
  height:calc(var(--stage) * var(--r-planet) * 2);
}
.ring.moon-ring{
  width:calc(var(--stage) * var(--r-moon) * 2);
  height:calc(var(--stage) * var(--r-moon) * 2);
  border-color:transparent;transition:border-color .5s ease;
}
.stage.focused .ring.moon-ring{border-color:var(--line)}

/* the single sphere material, shared by sun, planets and satellites */
.sphere{
  display:block;width:100%;height:100%;border-radius:50%;
  background:
    radial-gradient(circle at 34% 27%,
      #FFFFFF 0%, #DCE0E6 14%, #AFB5BF 36%, #71767F 60%, #3A3D44 82%, #202329 100%);
  box-shadow:
    inset -6px -9px 20px rgba(0,0,0,.55),
    inset 3px 4px 14px rgba(255,255,255,.10),
    0 14px 34px rgba(0,0,0,.55);
  transition:box-shadow .45s cubic-bezier(.2,.7,.25,1);
}

/* sun */
.sun{
  position:absolute;left:50%;top:50%;z-index:4;
  width:var(--d-sun);height:var(--d-sun);
  transform:translate(-50%,-50%);
  border:0;padding:0;background:none;cursor:pointer;
  transition:opacity .45s ease,transform .5s cubic-bezier(.2,.7,.25,1);
}
.sun .sphere{
  background:
    radial-gradient(circle at 35% 26%,
      #FFFFFF 0%, #F4F2EE 18%, #D6D3CC 42%, #9B978E 68%, #56534D 88%, #2C2A27 100%);
  box-shadow:
    inset -8px -12px 26px rgba(0,0,0,.5),
    inset 4px 5px 16px rgba(255,255,255,.18),
    0 0 70px rgba(236,232,222,.10),
    0 18px 46px rgba(0,0,0,.6);
}
.sun-cap{
  position:absolute;inset:0;display:grid;place-content:center;text-align:center;
}
.sun-cap b{
  display:block;font-family:var(--f-display);font-weight:700;
  font-size:calc(var(--d-sun) * .155);letter-spacing:.20em;
  color:#191A1D;line-height:1;
}
.stage.focused .sun{opacity:.4;transform:translate(-50%,-50%) scale(.97)}
.sun:hover{transform:translate(-50%,-50%) scale(1.045)}
.stage.focused .sun:hover{opacity:1}

/* ---------- nodes ---------- */
.node{
  position:absolute;left:50%;top:50%;width:0;height:0;
  transform:translate(var(--x),var(--y));
  pointer-events:none;
  transition:opacity .45s ease;
}
.stage.focused .node{opacity:.24}
.stage.focused .node.is-active{opacity:1;z-index:5}

/* generous invisible hit area so the pointer never falls through the gap */
.reach{
  position:absolute;left:0;top:0;border-radius:50%;
  width:calc(var(--stage) * .42);height:calc(var(--stage) * .42);
  transform:translate(-50%,-50%);pointer-events:none;
}
.node.is-active .reach{pointer-events:auto}

.drift{
  position:absolute;left:0;top:0;width:0;height:0;
  animation:drift var(--fd) ease-in-out infinite alternate;
  animation-delay:var(--fdl);
  transition:transform .6s cubic-bezier(.2,.7,.25,1);
}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
.node.is-active .drift{animation-play-state:paused}

.planet{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  width:var(--d-planet);height:var(--d-planet);
  border:0;padding:0;background:none;cursor:pointer;pointer-events:auto;
  transition:transform .5s cubic-bezier(.2,.7,.25,1);
}
.planet-name{
  position:absolute;left:50%;top:calc(100% + 15px);transform:translateX(-50%);
  font-family:var(--f-display);font-weight:600;
  font-size:clamp(11px,calc(var(--stage) * .0175),13.5px);
  letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
  color:var(--ink-2);transition:color .4s ease,letter-spacing .5s ease;
}
.planet-meta{
  position:absolute;left:50%;top:calc(100% + 34px);transform:translateX(-50%);
  font-size:11px;letter-spacing:.06em;color:var(--ink-3);white-space:nowrap;
  opacity:0;transition:opacity .4s ease;
}
.node.is-active .planet{transform:translate(-50%,-50%) scale(1.32)}
.node.is-active .sphere{
  box-shadow:
    inset -6px -9px 20px rgba(0,0,0,.5),
    inset 3px 4px 14px rgba(255,255,255,.16),
    0 0 0 1px rgba(255,255,255,.14),
    0 0 44px rgba(255,255,255,.10),
    0 18px 40px rgba(0,0,0,.6);
}
.node.is-active .planet-name{color:var(--ink);letter-spacing:.19em}
.node.is-active .planet-meta{opacity:1}

/* ---------- satellites: pushed outward onto the moon ring ---------- */
.moon{
  position:absolute;left:0;top:0;
  transform:translate(-50%,-50%) scale(.2);
  opacity:0;pointer-events:none;
  transition:transform .55s cubic-bezier(.18,.72,.24,1),opacity .35s ease;
}
.node.is-active .moon{
  transform:translate(calc(var(--mx) - 50%),calc(var(--my) - 50%)) scale(1);
  opacity:1;pointer-events:auto;
}
.moon-body{
  position:relative;display:block;
  width:var(--d-moon);height:var(--d-moon);
  transition:transform .35s cubic-bezier(.2,.7,.25,1);
}
.moon:hover .moon-body{transform:scale(1.14)}
.moon-name{
  position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);
  font-size:11.5px;font-weight:500;letter-spacing:.015em;white-space:nowrap;
  color:var(--ink-2);transition:color .3s ease;
}
/* label sits on the outward side, so it never lands on the parent planet */
.moon.up .moon-name{top:auto;bottom:calc(100% + 12px)}
.moon:hover .moon-name{color:var(--ink)}
.moon-name .lock{color:var(--ink-3);font-size:10px;letter-spacing:.1em;margin-left:5px}
.moon.pending .moon-body{opacity:.4}
.moon.pending .moon-name{color:var(--ink-3)}

.hint{
  position:relative;z-index:2;
  font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  padding-block:6px 54px;
}

/* ---------- directory ---------- */
.dir{position:relative;z-index:2;padding-block:0 72px}
.dir-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:14px;border-bottom:1px solid var(--line-2);
}
.dir-head h2{
  font-family:var(--f-display);font-weight:600;font-size:11.5px;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);margin:0;
}
.dir-head span{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}

.row{
  display:grid;grid-template-columns:168px minmax(0,1fr) auto;
  align-items:baseline;gap:20px;
  padding:17px 10px 17px 0;margin-inline:-10px;padding-left:10px;
  border-bottom:1px solid var(--line);
  transition:background .2s ease;
}
a.row:hover{background:rgba(255,255,255,.035)}
.row .cat{
  font-family:var(--f-display);font-weight:500;font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
  transition:color .2s ease;
}
a.row:hover .cat{color:var(--ink-2)}
.row .name{font-size:15.5px;font-weight:500;color:var(--ink);letter-spacing:-.005em}
.row .note{display:block;font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.5;font-weight:400}
.row .end{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;transition:color .2s ease,transform .2s ease;
}
a.row:hover .end{color:var(--ink);transform:translateX(3px)}
.row.empty .name{color:var(--ink-3);font-weight:400}

footer{
  position:relative;z-index:2;padding-block:0 56px;
  font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);
}

/* ---------- panel ---------- */
.scrim{
  position:fixed;inset:0;z-index:20;background:rgba(4,5,7,.7);
  backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.scrim.open{opacity:1;pointer-events:auto}
.panel{
  position:fixed;z-index:21;top:0;right:0;height:100%;width:min(430px,92vw);
  background:#0D0F13;border-left:1px solid var(--line-2);
  transform:translateX(102%);transition:transform .42s cubic-bezier(.2,.75,.25,1);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.panel.open{transform:translateX(0)}
.panel-in{padding:38px 32px 40px;overflow-y:auto}
.panel h2{
  font-family:var(--f-display);font-weight:600;font-size:22px;
  letter-spacing:.03em;margin:0 0 10px;
}
.panel .lede{margin:0;color:var(--ink-2);font-size:14px;line-height:1.6}
.panel h3{
  font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink-3);margin:34px 0 4px;
  padding-bottom:12px;border-bottom:1px solid var(--line-2);
}
.panel .prow{
  display:block;padding:16px 10px 16px 0;border-bottom:1px solid var(--line);
  margin-inline:-10px;padding-left:10px;transition:background .2s ease;
}
a.prow:hover{background:rgba(255,255,255,.04)}
.panel .prow .t{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:500}
.panel .prow .t .end{margin-left:auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.panel .prow .n{font-size:13px;color:var(--ink-3);margin-top:4px;line-height:1.5}
.closebtn{
  position:absolute;top:calc(28px + env(safe-area-inset-top,0px));right:26px;
  background:none;border:0;color:var(--ink-3);cursor:pointer;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-family:var(--f-body);
}
.closebtn:hover{color:var(--ink)}

@media (max-width:820px){
  :root{--stage:min(600px,92vw)}
  .wrap{padding-inline:20px}
  .row{grid-template-columns:1fr auto;gap:8px 16px}
  .row .cat{grid-column:1/-1;margin-bottom:2px}
  .panel{top:auto;bottom:0;right:0;width:100%;height:min(78vh,640px);
    border-left:0;border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;
    transform:translateY(102%)}
  .panel.open{transform:translateY(0)}
}
@media (max-width:620px){
  .moon-name{display:none}
}
@media (prefers-reduced-motion:reduce){
  .drift{animation:none}
}
</style>

<header class="masthead wrap">
  <div class="wordmark">MAMF AI</div>
  <div class="count" id="count"></div>
</header>

<section class="mapsec" aria-label="Tool map">
  <div class="stage" id="stage">
    <div class="ring planet-ring"></div>
    <div class="ring moon-ring"></div>
    <button class="sun" id="sun" aria-label="MAMF AI — all categories">
      <span class="sphere"></span>
      <span class="sun-cap"><b>MAMF AI</b></span>
    </button>
  </div>
  <p class="hint">Hover a category</p>
</section>

<main class="dir wrap">
  <div class="dir-head">
    <h2>Directory</h2>
    <span id="dirCount"></span>
  </div>
  <div id="rows"></div>
</main>

<footer class="wrap" id="foot"></footer>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelName" hidden>
  <button class="closebtn" id="closebtn">Close</button>
  <div class="panel-in" id="panelIn"></div>
</aside>

<script>
/* ==========================================================
   CONFIG — the only block to edit.
     url:""      renders the tool as "link pending"
     gated:true  adds a "sign-in" marker
   Order below = clockwise from the top of the ring.
   ========================================================== */
var CATEGORIES = [
  {
    name:"Prospecting",
    blurb:"Finding and ranking the next deal before anyone else does.",
    tools:[
      { name:"PBS8 Database",
        url:"https://mrare-cmd.github.io/HAP-Database/",
        note:"Project-based Section 8 contracts, rents and renewal options." },
      { name:"TOPA Dashboard",
        url:"https://mrare-cmd.github.io/mrare/",
        note:"DC TOPA and DOPA notices and offers of sale." },
      { name:"Priority Dashboard",
        url:"https://mrare-cmd.github.io/greysteel-hampton-roads/",
        note:"Ranked prospecting targets and outreach status." }
    ]
  },
  {
    name:"Underwriting",
    blurb:"Models, comps and assumptions that feed a deal's numbers.",
    tools:[
      { name:"OpEx Dashboard",
        url:"https://gs-expense-comps.pages.dev/",
        gated:true,
        note:"Operating expense comparables by market and asset type." }
    ]
  },
  {
    name:"Client Tools",
    blurb:"Things we put directly in a client's hands.",
    tools:[
      { name:"Inspection Assistant",
        url:"https://mrare-cmd.github.io/walkthrough/app.html",
        note:"Guided property walkthrough capture and write-up." }
    ]
  },
  { name:"Comparables", blurb:"Sales, rent and expense comp sets.", tools:[] },
  { name:"Production",  blurb:"Turning underwriting into client-ready deliverables.", tools:[] },
  { name:"Miscellaneous", blurb:"Everything that does not belong to one desk yet.", tools:[] }
];

var R_PLANET = 0.300;   /* must match --r-planet */
var R_MOON   = 0.408;   /* must match --r-moon   */
var FAN      = 26;      /* degrees between satellites */

var stage  = document.getElementById("stage");
var panel  = document.getElementById("panel");
var scrim  = document.getElementById("scrim");
var nodes  = [];
var closeT = null;

var total = 0, live = 0;
CATEGORIES.forEach(function(c){
  total += c.tools.length;
  live  += c.tools.filter(function(t){ return !!t.url; }).length;
});
document.getElementById("count").textContent = live + " tools · " + CATEGORIES.length + " categories";
document.getElementById("dirCount").textContent = live + " of " + total + " linked";
document.getElementById("foot").textContent =
  "Edit the CATEGORIES block in index.html to add a tool.";

function sphere(){ var s = document.createElement("span"); s.className = "sphere"; return s; }
function frac(k){ return "calc(var(--stage) * " + k.toFixed(5) + ")"; }

/* ---- build the ring ---- */
CATEGORIES.forEach(function(cat, i){
  var theta = (-90 + i * (360 / CATEGORIES.length)) * Math.PI / 180;
  var px = R_PLANET * Math.cos(theta);
  var py = R_PLANET * Math.sin(theta);

  var node = document.createElement("div");
  node.className = "node";
  node.style.setProperty("--x", frac(px));
  node.style.setProperty("--y", frac(py));

  var reach = document.createElement("div");
  reach.className = "reach";
  node.appendChild(reach);

  /* satellites sit on the outer circumference, fanned around their parent's angle */
  var n = cat.tools.length;
  cat.tools.forEach(function(tool, j){
    var phi = theta + ((j - (n - 1) / 2) * FAN) * Math.PI / 180;
    var el = document.createElement(tool.url ? "a" : "span");
    el.className = "moon" + (tool.url ? "" : " pending") +
                   (Math.sin(phi) < 0 ? " up" : "");
    if (tool.url) { el.href = tool.url; el.target = "_blank"; el.rel = "noopener"; }
    el.style.setProperty("--mx", frac(R_MOON * Math.cos(phi) - px));
    el.style.setProperty("--my", frac(R_MOON * Math.sin(phi) - py));
    el.style.transitionDelay = (j * 60) + "ms, " + (j * 60) + "ms";

    var body = document.createElement("span");
    body.className = "moon-body";
    body.appendChild(sphere());

    var nm = document.createElement("span");
    nm.className = "moon-name";
    nm.appendChild(document.createTextNode(tool.name));
    if (tool.gated) {
      var lk = document.createElement("span");
      lk.className = "lock"; lk.textContent = "SIGN-IN";
      nm.appendChild(lk);
    }
    body.appendChild(nm);
    el.appendChild(body);
    node.appendChild(el);
  });

  /* the planet itself drifts gently; it settles the moment it is active */
  var drift = document.createElement("div");
  drift.className = "drift";
  drift.style.setProperty("--dx", (Math.sin(i * 2.1) * 5).toFixed(2) + "px");
  drift.style.setProperty("--dy", (Math.cos(i * 1.7) * 6).toFixed(2) + "px");
  drift.style.setProperty("--fd", (7.5 + (i % 4) * 1.6).toFixed(1) + "s");
  drift.style.setProperty("--fdl", (-i * 1.3).toFixed(1) + "s");

  var planet = document.createElement("button");
  planet.className = "planet";
  planet.setAttribute("aria-label", cat.name + " — " + n + (n === 1 ? " tool" : " tools"));
  planet.appendChild(sphere());
  var nm2 = document.createElement("span");
  nm2.className = "planet-name"; nm2.textContent = cat.name;
  var meta = document.createElement("span");
  meta.className = "planet-meta";
  meta.textContent = n ? n + (n === 1 ? " tool" : " tools") : "no tools yet";
  planet.appendChild(nm2); planet.appendChild(meta);

  drift.appendChild(planet);
  node.appendChild(drift);
  stage.appendChild(node);
  nodes.push(node);

  node.addEventListener("pointerenter", function(){ activate(node); });
  node.addEventListener("pointerleave", release);
  planet.addEventListener("focus", function(){ activate(node); });
  node.addEventListener("focusout", function(e){
    if (!node.contains(e.relatedTarget)) release();
  });
  planet.addEventListener("click", function(){ openPanel(cat); });
});

function activate(node){
  clearTimeout(closeT);
  stage.classList.add("focused");
  nodes.forEach(function(n){ n.classList.toggle("is-active", n === node); });
}
/* a grace period, so crossing the gap out to a satellite never dismisses it */
function release(){
  clearTimeout(closeT);
  closeT = setTimeout(function(){
    stage.classList.remove("focused");
    nodes.forEach(function(n){ n.classList.remove("is-active"); });
  }, 320);
}
stage.addEventListener("pointerleave", release);

/* ---- directory ---- */
var rows = document.getElementById("rows");
CATEGORIES.forEach(function(cat){
  if (!cat.tools.length) {
    var s = document.createElement("div");
    s.className = "row empty";
    s.innerHTML = '<span class="cat"></span>';
    s.querySelector(".cat").textContent = cat.name;
    var nm = document.createElement("span"); nm.className = "name"; nm.textContent = "Awaiting links";
    var en = document.createElement("span"); en.className = "end"; en.textContent = "—";
    s.appendChild(nm); s.appendChild(en);
    rows.appendChild(s);
    return;
  }
  cat.tools.forEach(function(tool, j){
    var row = document.createElement(tool.url ? "a" : "div");
    row.className = "row" + (tool.url ? "" : " empty");
    if (tool.url) { row.href = tool.url; row.target = "_blank"; row.rel = "noopener"; }

    var c = document.createElement("span"); c.className = "cat";
    c.textContent = j === 0 ? cat.name : "";

    var nm = document.createElement("span"); nm.className = "name";
    nm.appendChild(document.createTextNode(tool.name));
    if (tool.note) {
      var note = document.createElement("span");
      note.className = "note"; note.textContent = tool.note;
      nm.appendChild(note);
    }

    var end = document.createElement("span"); end.className = "end";
    end.textContent = tool.url ? (tool.gated ? "Sign-in  ↗" : "Open  ↗") : "Link pending";

    row.appendChild(c); row.appendChild(nm); row.appendChild(end);
    rows.appendChild(row);
  });
});

/* ---- panel ---- */
var panelIn = document.getElementById("panelIn");
var lastFocus = null;

function openPanel(cat){
  lastFocus = document.activeElement;
  panelIn.innerHTML = "";

  var h = document.createElement("h2"); h.id = "panelName"; h.textContent = cat.name;
  var p = document.createElement("p"); p.className = "lede"; p.textContent = cat.blurb;
  panelIn.appendChild(h); panelIn.appendChild(p);

  var h3 = document.createElement("h3");
  h3.textContent = cat.tools.length
    ? (cat.tools.length === 1 ? "1 tool" : cat.tools.length + " tools")
    : "Nothing here yet";
  panelIn.appendChild(h3);

  if (!cat.tools.length) {
    var e = document.createElement("p");
    e.className = "lede"; e.style.marginTop = "18px";
    e.textContent = "Send the links for this category and they will appear here.";
    panelIn.appendChild(e);
  }

  cat.tools.forEach(function(tool){
    var row = document.createElement(tool.url ? "a" : "div");
    row.className = "prow";
    if (tool.url) { row.href = tool.url; row.target = "_blank"; row.rel = "noopener"; }

    var t = document.createElement("span"); t.className = "t";
    t.appendChild(document.createTextNode(tool.name));
    var end = document.createElement("span"); end.className = "end";
    end.textContent = tool.url ? (tool.gated ? "Sign-in  ↗" : "Open  ↗") : "Link pending";
    t.appendChild(end);
    row.appendChild(t);

    if (tool.note) {
      var n = document.createElement("span"); n.className = "n"; n.textContent = tool.note;
      row.appendChild(n);
    }
    panelIn.appendChild(row);
  });

  panel.hidden = false;
  requestAnimationFrame(function(){
    panel.classList.add("open");
    scrim.classList.add("open");
  });
  document.getElementById("closebtn").focus();
}

function closePanel(){
  panel.classList.remove("open");
  scrim.classList.remove("open");
  setTimeout(function(){ panel.hidden = true; }, 420);
  if (lastFocus) lastFocus.focus();
}
document.getElementById("closebtn").addEventListener("click", closePanel);
scrim.addEventListener("click", closePanel);
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && !panel.hidden) closePanel();
});

document.getElementById("sun").addEventListener("click", function(){
  openPanel({
    name: "MAMF AI",
    blurb: "Every tool the team has built, in one place. Each category on the ring holds its own projects — hover to bring them out, or use the directory below.",
    tools: CATEGORIES.map(function(c){
      return { name: c.name, url: "", note: c.blurb };
    })
  });
});
</script>
